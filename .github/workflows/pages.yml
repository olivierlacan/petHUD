name: deploy-pages

# Publishes the static viewer (web/) to GitHub Pages. No build is required at
# deploy time — web/ already contains the vendored pdf.js and the generated
# knowledge.json / patients.json (regenerate locally with `bin/pethud build-web`
# after editing config/). Enable Pages for the repo with "GitHub Actions" source.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
