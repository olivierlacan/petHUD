<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Self-hosted, in-browser analyzer for IDEXX VetConnect PLUS pet bloodwork PDFs. Your reports are parsed and stored locally — nothing is uploaded.">
  <title>PetHUD — pet bloodwork trends</title>
  <!-- Inline SVG favicon (no extra request; avoids a favicon.ico 404). -->
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a63d6'/%3E%3Cellipse cx='4.7' cy='7.2' rx='1.05' ry='1.45' fill='white'/%3E%3Cellipse cx='7' cy='5.4' rx='1.15' ry='1.6' fill='white'/%3E%3Cellipse cx='9' cy='5.4' rx='1.15' ry='1.6' fill='white'/%3E%3Cellipse cx='11.3' cy='7.2' rx='1.05' ry='1.45' fill='white'/%3E%3Cpath d='M8 8.1c-2.05 0-3.7 1.4-3.7 3.15 0 1.28 1.05 2.05 2.25 2.05 .7 0 1.05-.32 1.45-.32s.75.32 1.45.32c1.2 0 2.25-.77 2.25-2.05C11.7 9.5 10.05 8.1 8 8.1z' fill='white'/%3E%3C/svg%3E">
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%231a63d6'/%3E%3Cellipse cx='4.7' cy='7.2' rx='1.05' ry='1.45' fill='white'/%3E%3Cellipse cx='7' cy='5.4' rx='1.15' ry='1.6' fill='white'/%3E%3Cellipse cx='9' cy='5.4' rx='1.15' ry='1.6' fill='white'/%3E%3Cellipse cx='11.3' cy='7.2' rx='1.05' ry='1.45' fill='white'/%3E%3Cpath d='M8 8.1c-2.05 0-3.7 1.4-3.7 3.15 0 1.28 1.05 2.05 2.25 2.05 .7 0 1.05-.32 1.45-.32s.75.32 1.45.32c1.2 0 2.25-.77 2.25-2.05C11.7 9.5 10.05 8.1 8 8.1z' fill='white'/%3E%3C/svg%3E">
  <!-- Apply the saved/queried theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var t = q || localStorage.getItem("pethud-theme") || localStorage.getItem("indexx-theme") || "auto";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "auto"); }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <ellipse cx="6.5" cy="10.5" rx="1.8" ry="2.3"></ellipse>
          <ellipse cx="10.2" cy="7.6" rx="1.9" ry="2.5"></ellipse>
          <ellipse cx="13.8" cy="7.6" rx="1.9" ry="2.5"></ellipse>
          <ellipse cx="17.5" cy="10.5" rx="1.8" ry="2.3"></ellipse>
          <path d="M12 12.2c-3.2 0-5.8 2.2-5.8 4.9 0 2 1.7 3.2 3.5 3.2 1.1 0 1.7-.5 2.3-.5s1.2.5 2.3.5c1.8 0 3.5-1.2 3.5-3.2 0-2.7-2.6-4.9-5.8-4.9z"></path>
        </svg>
      </span>
      <div class="brand-text">
        <span class="logo">Pet<span class="hud">HUD</span></span>
        <span class="sub">pet bloodwork trends</span>
      </div>
    </div>

    <div class="controls">
      <select id="patient" class="ctl-select" aria-label="Patient"></select>

      <div class="seg" id="view-toggle" role="tablist">
        <button data-view="trends" class="active">Trends</button>
        <button data-view="conditions">Conditions</button>
        <button data-view="reports">Reports</button>
      </div>

      <input id="search" class="ctl-search" type="search" placeholder="Search analytes…" aria-label="Search analytes" autocomplete="off">

      <label class="check">
        <input type="checkbox" id="abnormal-only">
        <span>Out of range only</span>
      </label>
    </div>

    <!-- Theme override: Auto / Light / Dark — a direct topbar child so it can sit
         far-right on wide screens and ride up to the brand row when controls wrap. -->
    <div id="theme-toggle" class="theme-toggle" role="group" aria-label="Color theme">
      <button data-theme-set="auto" title="Match system" aria-label="Match system">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"></path>
        </svg>
      </button>
      <button data-theme-set="light" title="Light" aria-label="Light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="4.2"></circle>
          <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.1 5.1l1.6 1.6M17.3 17.3l1.6 1.6M18.9 5.1l-1.6 1.6M6.7 17.3l-1.6 1.6"></path>
        </svg>
      </button>
      <button data-theme-set="dark" title="Dark" aria-label="Dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
          <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
        </svg>
      </button>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <div class="side-head">
        <span class="side-title">Sections</span>
        <button id="toggle-sections" class="side-toggle" type="button"></button>
      </div>
      <div id="section-filter" class="section-list" role="group" aria-label="Toggle sections"></div>
      <div class="side-foot" id="corpus-meta"></div>
    </aside>

    <section class="content">
      <div id="trends" class="view"></div>
      <div id="conditions" class="view" hidden></div>
      <div id="reports" class="view" hidden></div>
    </section>
  </main>

  <footer class="footer">
    <span id="patient-meta"></span>
  </footer>

  <!-- Hidden file picker — the touch-friendly import path (drag-drop needs a mouse) -->
  <input id="file-input" type="file" accept="application/pdf,.pdf" multiple hidden>

  <!-- Pets & aliases manager -->
  <div id="pets" class="overlay" hidden>
    <div class="overlay-card">
      <button class="close" id="pets-close" aria-label="Close">&times;</button>
      <h2 style="margin:0 0 4px">Pets &amp; aliases</h2>
      <div id="pets-body"></div>
    </div>
  </div>

  <!-- Owner journal: weight + events (meds, diet, symptoms) -->
  <div id="journal" class="overlay" hidden>
    <div class="overlay-card">
      <button class="close" id="journal-close" aria-label="Close">&times;</button>
      <h2 style="margin:0 0 4px">Weight &amp; notes</h2>
      <div id="journal-body"></div>
    </div>
  </div>

  <!-- Detail overlay for a single analyte -->
  <div id="detail" class="overlay" hidden>
    <div class="overlay-card">
      <button class="close" id="detail-close" aria-label="Close">&times;</button>
      <div id="detail-body"></div>
    </div>
  </div>

  <!-- Full detail for a single report (every value from one visit) -->
  <div id="report-detail" class="overlay" hidden>
    <div class="overlay-card">
      <button class="close" id="report-detail-close" aria-label="Close">&times;</button>
      <div id="report-detail-body"></div>
    </div>
  </div>

  <!-- Drag-and-drop import affordance -->
  <div id="dropzone" class="dropzone" hidden>
    <div class="drop-inner">
      <div class="drop-icon">⤓</div>
      <div class="drop-text">Drop IDEXX PDF report(s) to import</div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
