# Disease / disorder views.
#
# Each condition lists the metrics genuinely linked to it in current veterinary
# science (with a role and citation), so the viewer can show a focused panel of
# just those trends. `missing_markers` names tests that matter for the condition
# but aren't present in the imported reports — surfaced honestly so the panel
# doesn't imply more coverage than the data supports.
#
# `staging` (CKD only) carries the verified IRIS feline cutoffs. The viewer
# renders these as orientation for the latest value, NOT a diagnosis: real IRIS
# staging needs persistent values in a hydrated, stable cat plus substaging.
#
# Analyte keys must match analytes.yml / the parsed data exactly.

disclaimer: >
  This is educational context to help you read trends and ask better questions —
  not veterinary advice, and not a diagnosis. Lab values must be interpreted by
  your veterinarian in the context of your cat's history and exam.

conditions:
  chronic-kidney-disease:
    screenable: true
    name: "Chronic Kidney Disease (CKD)"
    summary: >
      A common, progressive loss of kidney function in older cats. Diagnosis and
      monitoring center on filtration markers (creatinine, SDMA), the kidneys'
      ability to concentrate urine, proteinuria, phosphorus, potassium, blood
      pressure, and anemia.
    sources: [iris_staging, idexx_iris_guide, eclinpath_creatinine]
    metrics:
      - { analyte: "Chemistry / IDEXX SDMA", role: "Early filtration marker / IRIS staging" }
      - { analyte: "Chemistry / Creatinine", role: "Primary filtration marker / IRIS staging" }
      - { analyte: "Chemistry / BUN", role: "Supporting (less specific) waste marker" }
      - { analyte: "Urinalysis / Specific Gravity", role: "Urine-concentrating ability" }
      - { analyte: "Urinalysis / Urine Protein", role: "Proteinuria (confirm with UPC) — substaging" }
      - { analyte: "Chemistry / Phosphorus", role: "Mineral control; rises with progression" }
      - { analyte: "Chemistry / Calcium", role: "Calcium-phosphorus balance" }
      - { analyte: "Chemistry / Potassium", role: "Often low in CKD cats" }
      - { analyte: "Hematology / Hematocrit", role: "CKD-related non-regenerative anemia" }
    missing_markers:
      - "Urine protein:creatinine ratio (UPC) — needed for IRIS proteinuria substaging"
      - "Systolic blood pressure — needed for IRIS hypertension substaging"
    staging:
      note: >
        IRIS stages CKD on persistent fasting creatinine and/or SDMA in a
        hydrated, stable cat, then substages by proteinuria (UPC) and blood
        pressure. The bands below orient a single value; they are not a stage.
      source: idexx_iris_guide
      creatinine:
        unit: "mg/dL"
        bands:
          - { stage: 1, label: "No azotemia", max: 1.6 }
          - { stage: 2, label: "Mild azotemia", min: 1.6, max: 2.8 }
          - { stage: 3, label: "Moderate azotemia", min: 2.9, max: 5.0 }
          - { stage: 4, label: "Severe azotemia", min: 5.0 }
      sdma:
        unit: "µg/dL"
        bands:
          - { stage: 1, max: 18 }
          - { stage: 2, min: 18, max: 25 }
          - { stage: 3, min: 26, max: 38 }
          - { stage: 4, min: 38 }
      proteinuria_upc:
        cat: { non_proteinuric_max: 0.2, borderline: [0.2, 0.4], proteinuric_min: 0.4 }
      blood_pressure_mmhg:
        normotensive_max: 140
        prehypertensive: [140, 159]
        hypertensive: [160, 179]
        severely_hypertensive_min: 180

  hyperthyroidism:
    screenable: true
    name: "Hyperthyroidism"
    summary: >
      Overactive thyroid, common in older cats. Screened with Total T4. It speeds
      metabolism, can mildly raise liver enzymes, and — importantly — increases
      kidney blood flow, which can mask underlying CKD until the thyroid is
      treated.
    sources: [cornell_thyroid, aafp_hyperthyroid]
    metrics:
      - { analyte: "Endocrinology / Total T4", role: "Primary screening test" }
      - { analyte: "Chemistry / ALT", role: "Often mildly elevated" }
      - { analyte: "Chemistry / ALP", role: "Often mildly elevated" }
      - { analyte: "Chemistry / Creatinine", role: "May be masked low; watch after treatment" }
      - { analyte: "Chemistry / IDEXX SDMA", role: "May be masked low; watch after treatment" }
    missing_markers:
      - "Free T4 by equilibrium dialysis / T3 — for ambiguous high-normal T4 cases"

  heart-disease:
    screenable: true
    name: "Heart Disease (HCM screening)"
    summary: >
      Feline heart disease — most often hypertrophic cardiomyopathy — is often
      silent on routine bloodwork. The NT-proBNP (Cardiopet) biomarker screens
      for cardiac strain; abnormal results are confirmed with an echocardiogram.
    sources: [fox_ntprobnp, tvp_cardiac]
    metrics:
      - { analyte: "Chemistry / Cardiopet proBNP (Feline)", role: "Cardiac strain biomarker (screen)" }
      - { analyte: "Chemistry / Creatinine", role: "Kidney function affects NT-proBNP clearance" }
      - { analyte: "Endocrinology / Total T4", role: "Hyperthyroidism can stress the heart" }
    missing_markers:
      - "Echocardiogram — the confirmatory test; bloodwork alone cannot diagnose HCM"
      - "Blood pressure — hypertension contributes to cardiac changes"

  ibd-small-cell-lymphoma:
    screenable: true
    name: "IBD / Small Cell Lymphoma"
    summary: >
      Chronic inflammatory bowel disease (IBD) and low-grade (small cell)
      intestinal lymphoma sit on an overlapping spectrum and cannot be told apart
      by blood tests alone — distinguishing them requires intestinal biopsy with
      special testing. Bloodwork plays only a supporting role.
    sources: [acvim_enteropathy]
    metrics:
      - { analyte: "Chemistry / Albumin", role: "May be mildly low with chronic GI loss/inflammation" }
      - { analyte: "Chemistry / Total Protein", role: "Supporting protein status" }
      - { analyte: "Chemistry / Globulin", role: "Inflammation marker" }
      - { analyte: "Chemistry / Albumin: Globulin Ratio", role: "Protein-loss / inflammation pattern" }
    missing_markers:
      - "Cobalamin (vitamin B12) and folate — key GI markers, not on these panels"
      - "Intestinal biopsy with histopathology / clonality (PARR) — required to distinguish IBD from lymphoma"

  # --- Senior conditions that are mostly or entirely NOT detected by routine
  #     bloodwork. These panels are honest about that: they show whatever
  #     relevant values exist, then emphasize how the condition is really found
  #     and the signs to watch for at home (the `signs` field). ----------------

  hypertension:
    screenable: false
    name: "Systemic Hypertension"
    summary: >
      Persistently high blood pressure, common in senior cats and usually
      secondary to another disease — most often chronic kidney disease or
      hyperthyroidism. It is diagnosed by measuring blood pressure, not by
      bloodwork, but its common causes show up on these panels. Left untreated it
      damages the eyes, kidneys, heart, and brain.
    sources: [acvim_hypertension, iris_staging]
    metrics:
      - { analyte: "Chemistry / Creatinine", role: "CKD is a leading cause and consequence" }
      - { analyte: "Chemistry / IDEXX SDMA", role: "Kidney involvement" }
      - { analyte: "Endocrinology / Total T4", role: "Hyperthyroidism is a common cause" }
    missing_markers:
      - "Systolic blood pressure measurement — the actual diagnostic (>160 mmHg generally warrants treatment; <140 is ideal)"
      - "Fundic (retinal) exam — to check for hypertensive damage to the eyes"
    signs:
      - "Sudden blindness, a cloudy or bloody eye, or persistently dilated pupils"
      - "Disorientation, behavior change, or seizures"
      - "Often none — hypertension is frequently silent until organ damage occurs"

  diabetes-mellitus:
    screenable: true
    name: "Diabetes Mellitus"
    summary: >
      Inadequate insulin action causing persistently high blood sugar. In cats a
      single high glucose is usually just stress; diabetes requires persistent
      hyperglycemia with sugar spilling into the urine and clinical signs, often
      confirmed with fructosamine.
    sources: [icatcare_diabetes, merck_diabetes]
    metrics:
      - { analyte: "Chemistry / Glucose", role: "Persistent hyperglycemia — not one stressed reading" }
      - { analyte: "Urinalysis / Glucose", role: "Glucosuria — sugar appears in urine above ~250-300 mg/dL" }
    missing_markers:
      - "Fructosamine — reflects ~2 weeks of glucose and separates true diabetes from stress hyperglycemia"
    signs:
      - "Increased thirst and urination"
      - "Weight loss despite a normal or increased appetite"
      - "Walking on the hocks (plantigrade stance) in advanced cases"

  neoplasia:
    screenable: false
    name: "Neoplasia (Cancer)"
    summary: >
      Cancer risk rises with age. Most cancers cannot be screened for with routine
      bloodwork — they are found by physical exam, imaging, and sampling tissue
      (cytology or biopsy). Bloodwork is occasionally abnormal, but normal results
      do NOT rule cancer out.
    sources: [aafp_senior_care]
    metrics:
      - { analyte: "Chemistry / Calcium", role: "Occasionally high with some cancers (paraneoplastic) — not a screen" }
      - { analyte: "Hematology / Hematocrit", role: "May be low (anemia) with some cancers — non-specific" }
    missing_markers:
      - "Physical exam, imaging (radiographs / ultrasound), and cytology or biopsy — how cancer is actually found and confirmed"
    signs:
      - "New or growing lumps, or sores that don't heal"
      - "Unexplained weight loss, or persistent appetite/energy changes"
      - "Vomiting, diarrhea, difficulty breathing, or bleeding"

  osteoarthritis:
    screenable: false
    name: "Osteoarthritis"
    summary: >
      Degenerative joint disease affects most older cats but is easily missed —
      cats rarely limp obviously; they slow down instead. There is no blood test
      for it: diagnosis is by physical exam and joint radiographs.
    sources: [aafp_senior_care, merck_oa]
    metrics: []
    missing_markers:
      - "Orthopedic exam and joint radiographs — the basis of diagnosis; no bloodwork marker exists"
    signs:
      - "Reluctance to jump up or down, or not jumping as high as before"
      - "Stiffness, hesitation on stairs, sleeping more"
      - "Reduced grooming (a matted or greasy coat), overgrown nails, irritability when handled"

  cognitive-dysfunction:
    screenable: false
    name: "Cognitive Dysfunction"
    summary: >
      An age-related decline in brain function (feline dementia). There is no blood
      test; it is a diagnosis of exclusion after ruling out medical causes such as
      hyperthyroidism, hypertension, or pain. Its signs are summarized by the
      acronym DISHA-AL.
    sources: [aafp_senior_care]
    metrics: []
    missing_markers:
      - "Behavioral assessment plus a medical work-up to exclude other causes — there is no bloodwork marker"
    signs:
      - "Disorientation; changed interactions with people or other pets"
      - "Altered sleep cycles; house-soiling; more (often night-time) vocalization"
      - "Changes in activity, anxiety, or learning and memory (the 'DISHA-AL' signs)"

  dental-disease:
    screenable: false
    name: "Dental Disease"
    summary: >
      Periodontal disease and painful tooth and gum conditions are very common in
      older cats and largely hidden. Bloodwork doesn't detect it; a full
      assessment needs an oral exam and dental radiographs under anesthesia.
    sources: [aaha_dental, aafp_senior_care]
    metrics: []
    missing_markers:
      - "Oral examination and dental radiographs under anesthesia — required to assess the teeth and gums"
    signs:
      - "Bad breath, drooling, or blood-tinged saliva"
      - "Dropping food, chewing on one side, or pawing at the mouth"
      - "Reduced appetite or reluctance to eat dry food"
