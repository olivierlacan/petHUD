# Per-analyte educational context, shown above the trend chart.
#
# Keys are "Section / Name" and must match the parsed analyte exactly (the
# importer validates this and warns on any mismatch).
#
# Every entry is intentionally conservative and non-diagnostic. Fields:
#   summary        what the test measures, in plain language
#   high / low     what an out-of-range result *may* suggest (not a diagnosis)
#   isolation      the "don't over-read one value" caveat — shown prominently
#                  when this value is flagged, because many abnormals are only
#                  meaningful alongside related values
#   sources        ids from sources.yml backing the statements above
#
# Nothing here is a substitute for veterinary interpretation. See conditions.yml
# for how these roll up into disease-specific panels.

# Global primer shown on every analyte's detail page: why a single value (or a
# single dip/spike) is often not meaningful. Cited; applies to all analytes.
interpretation:
  title: "Reading changes over time"
  text: >
    A single result is noisier than it looks. Values move from one sample to the
    next for reasons that have nothing to do with disease: how the sample was
    taken and handled (hydration, fasting, stress, time to the lab), the
    analyzer's own imprecision, and your cat's normal day-to-day biological
    variation. For a change between two tests to be real, it has to exceed this
    combined "noise" — the reference change value. SDMA shows this well: a
    reported 14 can genuinely represent anywhere from about 8 to 20. So trust a
    trend across several consistent results, not one dip or spike, and the most
    reliable comparison is against your own cat's healthy baseline rather than
    the population reference range. Treatment, a recent meal, or IV fluids can
    also shift values on their own — see each metric's notes below.
  sources: [eclinpath_interpretation, baral_biovariation, baral_sdma_imprecision]

analytes:
  "Chemistry / IDEXX SDMA":
    dynamics:
      confounders: >
        Dominated by analytical imprecision — a reported value can swing roughly
        ±40% (a 14 can represent ~8–20), so small moves are often just noise.
        Less affected by muscle mass than creatinine; dehydration can nudge it up.
      monitoring: >
        Use persistent values, not a single reading, and compare against your
        cat's own baseline. In stable CKD it is typically rechecked every
        3–6 months.
      sources: [baral_sdma_imprecision, iris_staging]
    summary: >
      SDMA (symmetric dimethylarginine) is a kidney-filtration marker. It tends
      to rise earlier than creatinine — when roughly 25–40% of kidney function
      is lost — so it can flag chronic kidney disease before creatinine does.
    high: >
      A persistent SDMA above the reference interval suggests reduced kidney
      filtration. IRIS uses it (with creatinine) to stage CKD. A single mildly
      high value can be a false positive, so it should be rechecked.
    low: >
      Low SDMA is not clinically significant.
    isolation: >
      One high SDMA isn't a diagnosis. It's most meaningful when persistent
      (repeated, in a hydrated cat) and read together with creatinine, urine
      specific gravity, and phosphorus.
    sources: [eclinpath_sdma, jvim_sdma_gfr, iris_staging]

  "Chemistry / Creatinine":
    dynamics:
      confounders: >
        Rises with dehydration and higher muscle mass; falls with muscle loss.
        IV fluids can transiently lower it, and a renal diet lowers it modestly.
      monitoring: >
        Creatinine has high individuality — judge it against your cat's own
        healthy baseline rather than the reference range. Stable CKD is usually
        rechecked every 3–6 months, sooner if appetite, thirst, weight, or
        hydration change.
      sources: [baral_biovariation, iris_staging]
    summary: >
      Creatinine is a waste product cleared by the kidneys; blood levels rise as
      filtration falls. With SDMA it is the basis of IRIS CKD staging.
    high: >
      Elevated creatinine (azotemia) suggests reduced kidney filtration, but can
      also be pre-renal (dehydration) or, rarely, post-renal (obstruction).
      Higher muscle mass nudges it up; muscle loss lowers it.
    low: >
      Low creatinine is usually unimportant and can reflect low muscle mass.
    isolation: >
      Interpret with hydration status and urine specific gravity: a hydrated cat
      that still can't concentrate urine while azotemic points to kidney disease,
      whereas dehydration alone can raise creatinine transiently.
    sources: [eclinpath_creatinine, iris_staging]

  "Chemistry / BUN":
    dynamics:
      confounders: >
        Swings with hydration, the most recent meal (high-protein raises it), and
        GI bleeding; IV fluids and low-protein diets lower it. Less specific than
        creatinine or SDMA.
      monitoring: >
        Interpret alongside creatinine and hydration; a fasted sample compares
        better over time.
      sources: [eclinpath_urea]
    summary: >
      Blood urea nitrogen (BUN) is a protein-breakdown waste product filtered by
      the kidneys. It is a less specific kidney marker than creatinine or SDMA.
    high: >
      High BUN can reflect reduced kidney filtration, but is frequently raised by
      dehydration, a recent high-protein meal, or gastrointestinal bleeding.
    low: >
      Low BUN can follow a low-protein diet or liver dysfunction.
    isolation: >
      High BUN with normal creatinine and SDMA is often dehydration, diet, or GI
      bleeding rather than kidney disease — don't read it alone.
    sources: [eclinpath_urea]

  "Chemistry / BUN: Creatinine Ratio":
    summary: >
      The ratio of BUN to creatinine, used to help separate pre-renal causes
      (e.g. dehydration, GI bleeding) from intrinsic kidney disease.
    high: >
      A high ratio can suggest dehydration or gastrointestinal bleeding.
    low: >
      A low ratio can follow a low-protein diet or liver dysfunction.
    isolation: >
      A derived ratio — only meaningful alongside the BUN and creatinine values
      it's computed from, plus hydration status.
    sources: [eclinpath_urea]

  "Chemistry / Phosphorus":
    dynamics:
      confounders: >
        A recent meal, young age, and a hemolyzed sample raise it; phosphate
        binders and renal diets lower it.
      monitoring: >
        Tracked against IRIS stage-specific targets; fasting samples compare best.
      sources: [eclinpath_phosphate, iris_staging]
    summary: >
      Phosphorus is regulated partly by the kidneys. It is central to CKD
      monitoring, where IRIS sets stage-specific target ranges.
    high: >
      High phosphorus (hyperphosphatemia) is common as CKD advances and is a
      target of treatment (diet, binders). Young growing animals run higher.
    low: >
      Low phosphorus has several causes including some endocrine disorders.
    isolation: >
      Most informative in the context of kidney values and calcium — the
      calcium-phosphorus balance matters more than phosphorus alone.
    sources: [eclinpath_phosphate, iris_staging]

  "Chemistry / Calcium":
    dynamics:
      confounders: >
        Total calcium shifts with albumin and can be altered by lipemia; ionized
        calcium is the more reliable measure.
      monitoring: >
        Confirm a persistent abnormal with ionized calcium, and read it with
        phosphorus.
      sources: [eclinpath_calcium]
    summary: >
      Total blood calcium, tightly hormone-regulated. Calcium and phosphorus are
      interpreted together.
    high: >
      High calcium has many causes (some hormonal or neoplastic) and warrants
      follow-up, ideally with ionized calcium.
    low: >
      Low total calcium is often tied to low albumin and may not reflect true
      (ionized) calcium.
    isolation: >
      Total calcium is affected by albumin; an abnormal value is best confirmed
      with ionized calcium and read alongside phosphorus.
    sources: [eclinpath_calcium]

  "Chemistry / Potassium":
    dynamics:
      confounders: >
        A hemolyzed or delayed sample can read falsely high; IV fluids, diuresis,
        and poor appetite can lower it.
      monitoring: >
        Check the hemolysis index before trusting an unexpected change.
      sources: [eclinpath_potassium]
    summary: >
      A key electrolyte for nerve and muscle function, regulated by the kidneys.
    high: >
      High potassium can occur with urinary obstruction or severe kidney/adrenal
      disease and can affect the heart. Hemolyzed samples can read falsely high.
    low: >
      Low potassium (hypokalemia) is common in cats with CKD and can cause
      weakness.
    isolation: >
      Check the Hemolysis Index — a hemolyzed sample can spuriously change
      potassium. Otherwise interpret with kidney values.
    sources: [eclinpath_potassium]

  "Chemistry / Sodium":
    summary: >
      The major extracellular electrolyte, reflecting water balance more than
      salt intake.
    high: >
      High sodium usually reflects water deficit (dehydration).
    low: >
      Low sodium can reflect fluid shifts or losses.
    isolation: >
      Read with chloride, hydration status, and the other electrolytes — sodium
      alone rarely tells the story.
    sources: [eclinpath_sodium]

  "Chemistry / Chloride":
    summary: >
      An electrolyte that tracks closely with sodium and contributes to
      acid-base balance.
    high: >
      High chloride often parallels high sodium (dehydration) or acid-base shifts.
    low: >
      Low chloride can follow vomiting or acid-base disturbances.
    isolation: >
      Interpreted alongside sodium and the acid-base picture, not on its own.
    sources: [eclinpath_chloride]

  "Chemistry / Glucose":
    dynamics:
      confounders: >
        Stress at the visit and a recent meal raise it; a delayed or unseparated
        sample can read falsely low. None of these mean diabetes.
      monitoring: >
        Fructosamine reflects ~2 weeks and is steadier than a single glucose;
        at-home or fasted sampling reduces the stress effect.
      sources: [eclinpath_glucose, merck_diabetes]
    summary: >
      Blood sugar. In cats this is strongly affected by stress at the visit.
    high: >
      A high glucose in cats is frequently stress hyperglycemia rather than
      diabetes; fructosamine reflects the prior ~2 weeks and helps tell them
      apart. Persistent high glucose with clinical signs suggests diabetes.
    low: >
      Low glucose has several causes and, if real, can be serious; a delayed or
      mishandled sample can also read falsely low.
    isolation: >
      One high glucose in a stressed cat usually isn't diabetes — confirm with
      fructosamine (or repeat at home) before drawing conclusions.
    sources: [eclinpath_glucose, eclinpath_fructosamine, merck_diabetes]

  "Chemistry / Total Protein":
    summary: >
      The sum of albumin and globulins in blood; a broad screen interpreted via
      its two components.
    high: >
      High total protein can reflect dehydration or increased globulins
      (inflammation/immune stimulation).
    low: >
      Low total protein can follow loss (gut, kidney, blood) or reduced
      production.
    isolation: >
      Always break down into albumin vs globulin — the components, and their
      ratio, carry the meaning.
    sources: [eclinpath_total_protein]

  "Chemistry / Albumin":
    summary: >
      The main blood protein made by the liver; helps hold fluid in vessels.
    high: >
      High albumin essentially means dehydration (concentration).
    low: >
      Low albumin can reflect gastrointestinal loss, kidney loss, liver
      underproduction, or chronic inflammation. In chronic enteropathy it is
      usually only mildly low.
    isolation: >
      Read with globulin and total protein. In suspected gut disease, low
      albumin is a supportive — not specific — finding.
    sources: [eclinpath_albumin, acvim_enteropathy]

  "Chemistry / Globulin":
    summary: >
      A mixed group of blood proteins including antibodies; reflects immune and
      inflammatory activity.
    high: >
      High globulin suggests inflammation, chronic infection, or immune
      stimulation.
    low: >
      Low globulin can follow blood or gut loss, or immune deficiency.
    isolation: >
      Interpreted with albumin (and the A:G ratio); the pattern matters more than
      the single number.
    sources: [eclinpath_globulins]

  "Chemistry / Albumin: Globulin Ratio":
    summary: >
      The ratio of albumin to globulin, a pattern marker for inflammation and
      protein loss.
    high: >
      A high ratio is rarely a concern on its own.
    low: >
      A low ratio can reflect low albumin, high globulin, or both — seen with
      inflammation and some protein-losing conditions.
    isolation: >
      A derived value — interpret with the albumin and globulin it comes from.
    sources: [eclinpath_ag_ratio]

  "Chemistry / ALT":
    summary: >
      Alanine aminotransferase, an enzyme that leaks from liver cells when they
      are injured. A fairly liver-specific marker.
    high: >
      Elevated ALT indicates liver-cell injury, but the magnitude doesn't equal
      severity and many causes are mild or secondary (including hyperthyroidism
      in cats).
    low: >
      Low ALT is not clinically significant.
    isolation: >
      A modest ALT rise alone is non-specific. Read with ALP, GGT, bilirubin, and
      — in older cats — thyroid status.
    sources: [eclinpath_alt]

  "Chemistry / ALP":
    summary: >
      Alkaline phosphatase. In cats ALP has a short half-life, so even small
      elevations can be meaningful.
    high: >
      High ALP in cats can accompany cholestasis (impaired bile flow),
      hyperthyroidism, or other conditions and warrants follow-up.
    low: >
      Low ALP is not clinically significant.
    isolation: >
      Interpret with the other liver markers and thyroid status rather than alone.
    sources: [eclinpath_alp, aafp_hyperthyroid]

  "Chemistry / GGT":
    summary: >
      Gamma-glutamyl transferase, a liver/biliary enzyme that complements ALP for
      cholestasis.
    high: >
      High GGT supports a cholestatic (bile-flow) pattern of liver disease.
    low: >
      Low GGT is not clinically significant.
    isolation: >
      Best read alongside ALP and bilirubin as part of the cholestasis pattern.
    sources: [eclinpath_ggt]

  "Chemistry / Hemolysis Index":
    summary: >
      A sample-quality flag indicating red-cell breakdown (hemolysis) in the
      tube. It is about the specimen, not the patient.
    high: >
      A raised hemolysis index means some chemistry results on the same panel may
      be artifactually altered (e.g. potassium can read falsely high).
    low: >
      A normal index means hemolysis is unlikely to be skewing results.
    isolation: >
      This value exists precisely to caution interpretation of *other* results —
      check it before trusting an unexpected abnormal on the same panel.
    sources: [eclinpath_potassium]

  "Chemistry / Lipemia Index":
    summary: >
      A sample-quality flag indicating fat (lipemia) in the sample, often from a
      non-fasted draw. It is about the specimen, not the patient.
    high: >
      A raised lipemia index means some results on the same panel may be
      artifactually altered.
    low: >
      A normal index means lipemia is unlikely to be skewing results.
    isolation: >
      Like the hemolysis index, this is a caution flag for *other* values on the
      same panel — not a finding in itself.
    sources: [eclinpath_total_protein]

  "Chemistry / Cardiopet proBNP (Feline)":
    summary: >
      NT-proBNP is a hormone released when heart muscle is stretched or stressed.
      The Cardiopet proBNP test screens for heart disease (commonly hypertrophic
      cardiomyopathy) before symptoms appear.
    high: >
      An elevated NT-proBNP raises concern for cardiac disease and typically
      prompts an echocardiogram to confirm. It is sensitive for severe disease
      but can miss mild-to-moderate HCM, so a normal result doesn't fully exclude
      it. Reduced kidney function can also modestly raise it.
    low: >
      A low/normal result makes clinically significant heart strain less likely
      at that moment, but doesn't rule out early disease.
    isolation: >
      A blood biomarker, not a diagnosis — abnormal results are confirmed with
      imaging (echocardiogram), and the value is influenced by kidney function.
    sources: [fox_ntprobnp, tvp_cardiac]

  "Endocrinology / Total T4":
    dynamics:
      confounders: >
        Non-thyroidal illness can pull it down into the normal range; methimazole
        (anti-thyroid medication) lowers it by design.
      monitoring: >
        After starting or changing methimazole, T4 is rechecked in ~2–3 weeks,
        then periodically — and watch the kidney values, since treatment can
        unmask CKD.
      sources: [aafp_hyperthyroid, cornell_thyroid]
    summary: >
      Total thyroxine, the main screening test for feline hyperthyroidism — a
      common disease of older cats.
    high: >
      A high Total T4 with compatible signs supports hyperthyroidism. Early or
      concurrently-ill cats can sit high-normal, sometimes needing additional
      thyroid tests.
    low: >
      Low T4 can occur with non-thyroidal illness; primary hypothyroidism is rare
      in cats.
    isolation: >
      Importantly, hyperthyroidism increases kidney blood flow and can mask
      underlying CKD — kidney values may look better than they truly are and can
      worsen once thyroid levels are controlled. Interpret T4 and kidney values
      together.
    sources: [cornell_thyroid, aafp_hyperthyroid]

  "Hematology / Hematocrit":
    dynamics:
      confounders: >
        Dehydration concentrates it (a falsely reassuring value); IV fluids
        dilute it. Stress or excitement can transiently raise it in cats.
      monitoring: >
        Read with hydration status and reticulocytes; CKD-related anemia develops
        slowly over months.
      sources: [eclinpath_anemia, iris_staging]
    summary: >
      The fraction of blood made up of red cells; a core measure of anemia or
      dehydration.
    high: >
      A high hematocrit usually reflects dehydration (concentration) rather than
      true excess red cells.
    low: >
      A low hematocrit means anemia. Cats with advanced CKD often develop a mild,
      slowly-progressive non-regenerative anemia.
    isolation: >
      Read with hydration status (a dehydrated anemic cat can look deceptively
      normal) and the reticulocyte count to judge whether the marrow is
      responding.
    sources: [eclinpath_anemia]

  "Hematology / RBC":
    summary: >
      The red blood cell count — the number of red cells, which carry oxygen.
      It moves together with hematocrit and hemoglobin.
    high: >
      A true high count (erythrocytosis) is uncommon; far more often a high value
      reflects dehydration concentrating the blood, or stress/excitement
      transiently mobilising red cells in cats.
    low: >
      A low count means anemia. Whether the marrow is responding is judged by the
      reticulocyte count (regenerative vs non-regenerative).
    isolation: >
      Interpret alongside hematocrit, hemoglobin, hydration status, and
      reticulocytes rather than on its own.
    sources: [eclinpath_anemia]

  "Hematology / Hemoglobin":
    summary: >
      The concentration of hemoglobin, the oxygen-carrying protein in red cells.
      It tracks closely with the red cell count and hematocrit.
    high: >
      Usually reflects dehydration (concentration) or stress rather than a true
      excess of red cells.
    low: >
      A low hemoglobin indicates anemia. Read with the reticulocyte count to see
      whether the marrow is regenerating.
    isolation: >
      Lipemia or hemolysis in the sample can falsely raise the measured value, so
      read it together with the red cell count and hematocrit.
    sources: [eclinpath_anemia]

  "Hematology / MCV":
    summary: >
      Mean cell volume — the average size of the red cells. It classifies anemia
      as small-celled (microcytic), normal (normocytic), or large-celled
      (macrocytic).
    high: >
      Larger cells (macrocytosis) often accompany a regenerative response (young
      red cells are larger); in cats it can also occur with certain marrow
      disorders or FeLV.
    low: >
      Smaller cells (microcytosis) classically suggest iron deficiency (e.g.
      chronic blood loss) or portosystemic liver shunting.
    isolation: >
      Most useful read with MCHC and the reticulocyte count; a small average-size
      shift is not meaningful in isolation.
    sources: [eclinpath_rbc_indices, eclinpath_anemia]

  "Hematology / MCH":
    summary: >
      Mean cell hemoglobin — the average amount of hemoglobin per red cell. It
      moves in parallel with MCV and MCHC.
    high: >
      A high value is usually an artifact of lipemia or hemolysis in the sample
      rather than a true finding.
    low: >
      A low value reflects red cells with less hemoglobin, as in iron deficiency.
    isolation: >
      A calculated index best read alongside MCV, MCHC, and the red cell count,
      not on its own.
    sources: [eclinpath_rbc_indices]

  "Hematology / MCHC":
    summary: >
      Mean cell hemoglobin concentration — how concentrated the hemoglobin is
      within the red cells (normochromic vs hypochromic).
    high: >
      A true high is not biologically possible; an elevated MCHC almost always
      means hemolysis or lipemia in the sample interfered with the measurement.
    low: >
      A low MCHC (hypochromia) accompanies regeneration (young cells are less
      hemoglobinised) and iron deficiency.
    isolation: >
      Interpret with MCV and the reticulocyte count; treat a high value as a
      likely sample artifact first.
    sources: [eclinpath_rbc_indices]

  "Hematology / RDW":
    summary: >
      Red cell distribution width — how variable the red cells are in size
      (anisocytosis). It often rises before the average size (MCV) shifts.
    high: >
      A wider distribution means more variation in cell size, which can accompany
      a regenerative response or early iron deficiency.
    low: >
      A low RDW is not clinically significant.
    isolation: >
      A sensitive but non-specific flag; read with MCV and the reticulocyte count
      to understand what kind of cells are driving the variation.
    sources: [eclinpath_rbc_indices]

  "Hematology / Reticulocytes":
    summary: >
      The absolute count of reticulocytes — newly released, immature red cells.
      In cats the laboratory aggregate reticulocyte count is the key measure of
      whether the marrow is regenerating.
    high: >
      A raised reticulocyte count means the marrow is regenerating, as expected
      when anemia is caused by blood loss or red cell destruction (hemolysis).
    low: >
      A low or normal count in the face of anemia means the response is
      non-regenerative — the marrow isn't keeping up — as seen with chronic
      kidney disease, inflammation, or marrow disease.
    isolation: >
      Only meaningful alongside the degree of anemia; the same count can be normal
      or inadequate depending on how anemic the cat is.
    sources: [eclinpath_regeneration, eclinpath_anemia]

  # "% Reticulocyte" (singular) is aliased to "% Reticulocytes" in
  # config/analyte_aliases.json, so only the canonical key needs an entry.
  "Hematology / % Reticulocytes":
    summary: >
      The percentage of red cells that are reticulocytes (young red cells). The
      absolute reticulocyte count is the more reliable measure of regeneration.
    high: >
      A higher percentage suggests the marrow is producing new red cells, but a
      percentage can look high simply because the total red cell count is low.
    low: >
      A low percentage with anemia points to a non-regenerative process.
    isolation: >
      Prefer the absolute reticulocyte count, and read it against how anemic the
      cat actually is.
    sources: [eclinpath_regeneration]

  "Hematology / Reticulocyte Hemoglobin":
    summary: >
      The hemoglobin content of the youngest red cells (reticulocytes) — a
      near-real-time readout of whether enough iron is reaching the marrow to
      build new red cells.
    high: >
      A high value is not typically a concern.
    low: >
      A low value flags iron-restricted red cell production (e.g. iron deficiency
      from chronic blood loss) earlier than the standard indices do.
    isolation: >
      A forward-looking marker best read with MCV, MCHC, and the reticulocyte
      count when iron deficiency is being considered.
    sources: [eclinpath_regeneration, eclinpath_rbc_indices]

  "Hematology / WBC":
    summary: >
      The total white blood cell count — the body's circulating immune cells.
      Changes are interpreted from the differential (which cell types changed),
      not the total alone.
    high: >
      A high count (leukocytosis) commonly reflects inflammation, infection, or —
      very often in cats — a stress or excitement (adrenaline) response.
    low: >
      A low count (leukopenia) can reflect overwhelming infection consuming cells,
      or reduced marrow production; in cats it raises concern for viral disease.
    isolation: >
      Always read the differential: the same total can mean very different things
      depending on which white cell type is driving it.
    sources: [eclinpath_leukogram]

  "Hematology / Neutrophils":
    summary: >
      The absolute neutrophil count — the front-line cells against bacterial
      infection and inflammation. This absolute number is more meaningful than
      the percentage.
    high: >
      Neutrophilia accompanies inflammation and infection, and also a stress
      (steroid) response, which is common in cats.
    low: >
      Neutropenia can reflect consumption in severe infection or reduced marrow
      production, and warrants attention.
    isolation: >
      Read with the rest of the differential and the clinical picture; a stress
      pattern and an inflammatory pattern can look similar on the count alone.
    sources: [eclinpath_leukogram]

  "Hematology / % Neutrophils":
    summary: >
      The percentage of white cells that are neutrophils. The absolute neutrophil
      count (also reported) is the number to judge.
    high: >
      A higher share of neutrophils can reflect inflammation, infection, or a
      stress response — but a percentage shift can also just mirror a change in
      another cell line.
    low: >
      Interpret a low percentage via the absolute neutrophil count.
    isolation: >
      Percentages always sum to 100%, so one going up forces others down; rely on
      the absolute counts.
    sources: [eclinpath_leukogram]

  "Hematology / Lymphocytes":
    summary: >
      The absolute lymphocyte count — immune cells central to antibody and viral
      defense. Judge this absolute number rather than the percentage.
    high: >
      Lymphocytosis in cats is frequently a transient adrenaline (excitement)
      response; it can less commonly reflect chronic immune stimulation or
      lymphoid disease.
    low: >
      Lymphopenia is most often a stress (steroid) effect, and can also occur with
      acute viral infection or loss of lymph fluid.
    isolation: >
      Read with the full differential and the cat's stress level at sampling.
    sources: [eclinpath_leukogram]

  "Hematology / % Lymphocytes":
    summary: >
      The percentage of white cells that are lymphocytes. The absolute lymphocyte
      count is the more meaningful figure.
    high: >
      A higher share can reflect excitement or immune stimulation, but may simply
      mirror a fall in another cell type.
    low: >
      Interpret via the absolute lymphocyte count.
    isolation: >
      Because percentages are interdependent, rely on the absolute counts.
    sources: [eclinpath_leukogram]

  "Hematology / Monocytes":
    summary: >
      The absolute monocyte count — cells that clean up tissue debris and support
      chronic inflammation.
    high: >
      Monocytosis can accompany inflammation, tissue damage, or a stress response.
    low: >
      A low monocyte count is not clinically significant.
    isolation: >
      A supporting clue read alongside the neutrophil count and clinical picture,
      not a standalone finding.
    sources: [eclinpath_leukogram]

  "Hematology / % Monocytes":
    summary: >
      The percentage of white cells that are monocytes. The absolute count is the
      number to judge.
    high: >
      A higher share may reflect chronic inflammation, or simply mirror changes in
      other cell lines.
    low: >
      Interpret via the absolute monocyte count.
    isolation: >
      Rely on the absolute counts rather than the percentage.
    sources: [eclinpath_leukogram]

  "Hematology / Eosinophils":
    summary: >
      The absolute eosinophil count — cells involved in allergic and parasitic
      responses.
    high: >
      Eosinophilia classically points to parasites (e.g. fleas, intestinal worms)
      or allergic/hypersensitivity conditions; some feline syndromes raise it
      markedly.
    low: >
      A low eosinophil count is usually a stress (steroid) effect and is not a
      concern on its own.
    isolation: >
      Most informative with history (parasite exposure, skin or airway signs)
      rather than in isolation.
    sources: [eclinpath_leukogram]

  "Hematology / % Eosinophils":
    summary: >
      The percentage of white cells that are eosinophils. The absolute count is
      the more meaningful figure.
    high: >
      A higher share suggests an allergic or parasitic process; confirm with the
      absolute count.
    low: >
      Interpret via the absolute eosinophil count.
    isolation: >
      Rely on the absolute counts rather than the percentage.
    sources: [eclinpath_leukogram]

  "Hematology / Basophils":
    summary: >
      The absolute basophil count — a rare white cell type involved in allergic
      and parasitic immunity. Normally present in very low numbers in cats.
    high: >
      Basophilia is uncommon and, when present, tends to accompany the same
      allergic or parasitic conditions that raise eosinophils.
    low: >
      A low or zero basophil count is normal and not significant.
    isolation: >
      A minor finding interpreted alongside the eosinophil count.
    sources: [eclinpath_leukogram]

  "Hematology / % Basophils":
    summary: >
      The percentage of white cells that are basophils — normally very low.
    high: >
      A higher share is uncommon; confirm with the absolute count and read with
      the eosinophils.
    low: >
      Not significant.
    isolation: >
      Rely on the absolute counts rather than the percentage.
    sources: [eclinpath_leukogram]

  "Hematology / Platelets":
    dynamics:
      confounders: >
        Feline platelets clump extremely readily, which falsely lowers the
        automated count — so a low number is very often an artifact, not true
        thrombocytopenia. A blood-smear estimate is used to confirm.
      monitoring: >
        A genuinely low count is rechecked (often on a fresh, well-mixed sample)
        and confirmed on a smear before it is acted on.
      sources: [eclinpath_platelets]
    summary: >
      The platelet count — the cell fragments that form clots. In cats this is
      the count most prone to laboratory artifact.
    high: >
      A high count (thrombocytosis) in cats is usually a reactive response to
      inflammation or other stimuli rather than a primary problem.
    low: >
      A truly low count (thrombocytopenia) can raise bleeding risk, but in cats a
      low automated value is far more often caused by platelet clumping than by
      real disease.
    isolation: >
      Don't act on a low automated platelet count without a smear estimate to rule
      out clumping; true thrombocytopenia is uncommon in cats.
    sources: [eclinpath_platelets]

  "Urinalysis / Specific Gravity":
    dynamics:
      confounders: >
        Drops after IV fluids, diuretics, or a big drink of water; a fresh,
        pre-fluid sample is the most informative.
      monitoring: >
        Most meaningful paired with blood kidney values from the same visit.
      sources: [iris_staging]
    summary: >
      Urine specific gravity (USG) measures how concentrated the urine is — a
      direct readout of the kidneys' concentrating ability.
    high: >
      Well-concentrated urine (cats typically concentrate above ~1.035) suggests
      the kidneys are conserving water effectively.
    low: >
      Dilute urine, especially alongside elevated kidney values, is a hallmark of
      reduced concentrating ability in CKD. It can also follow other causes of
      increased drinking.
    isolation: >
      USG is the key partner to blood kidney values: azotemia *with* dilute urine
      points to kidney disease, whereas azotemia with concentrated urine suggests
      dehydration. Always read them together.
    sources: [iris_staging, eclinpath_creatinine]

  "Urinalysis / Glucose":
    summary: >
      Glucose (sugar) in the urine. Healthy cats have none; it appears only when
      blood glucose climbs high enough to spill past the kidneys (~250–300 mg/dL).
    high: >
      Glucose in the urine (glucosuria) most often reflects persistently high
      blood sugar — a key supporting finding for diabetes. Brief stress
      hyperglycemia can occasionally cause transient glucosuria as well.
    low: >
      "Negative" is the normal, expected result.
    isolation: >
      Confirm with blood glucose and ideally fructosamine — a single positive,
      especially in a stressed cat, is not a diabetes diagnosis on its own.
    sources: [eclinpath_glucose, merck_diabetes]

  "Urinalysis / Urine Protein":
    dynamics:
      confounders: >
        Blood or infection in the sample, and normal day-to-day variation, move
        it; the dipstick is only a screen.
      monitoring: >
        Quantify and trend with a UPC ratio on a clean sample — UPC itself has
        notable biological variation, so rely on several measurements.
      sources: [mortier_upc_usg, iris_staging]
    summary: >
      A dipstick estimate of protein in urine. Proteinuria is a risk factor for
      CKD progression; IRIS substages CKD by the urine protein:creatinine (UPC)
      ratio.
    high: >
      Protein in urine can indicate kidney involvement, but the dipstick is only a
      screen — it must be confirmed and quantified with a UPC ratio on a sample
      without blood or infection.
    low: >
      Absence of dipstick protein is reassuring but doesn't fully exclude
      low-level proteinuria.
    isolation: >
      A positive dipstick alone isn't meaningful — it needs a UPC ratio and an
      inactive sediment (no blood/infection) to interpret for CKD substaging.
    sources: [iris_staging]

  # ---- Chemistry (liver / lipids / enzymes / acid-base / misc) -------------
  "Chemistry / AST":
    summary: >
      Aspartate aminotransferase is a "leakage" enzyme found in both liver and
      muscle cells; it rises when those cells are injured.
    high: >
      A high AST means liver-cell or muscle damage. It is less liver-specific
      than ALT, so AST up alongside ALT points to the liver, while AST up with a
      high creatine kinase points to muscle.
    low: >
      Low AST is not clinically significant.
    isolation: >
      Read with ALT (liver) and creatine kinase (muscle) to localize the source;
      a rough blood draw can nudge it up on its own.
    sources: [eclinpath_ast, eclinpath_alt]

  "Chemistry / Bilirubin - Total":
    summary: >
      Bilirubin is a pigment from the breakdown of red cells that the liver
      processes and excretes in bile; total bilirubin is the sum of its
      conjugated and unconjugated forms.
    high: >
      A high total bilirubin causes jaundice and points to one of three things:
      increased red-cell destruction (pre-hepatic), liver disease, or obstructed
      bile flow (post-hepatic). In cats even mild elevations matter, and hepatic
      lipidosis is a common cause.
    low: >
      Low bilirubin is not clinically significant.
    isolation: >
      Interpret with the conjugated/unconjugated split, the liver enzymes, and
      red-cell values (hematocrit, reticulocytes) to find the cause.
    sources: [eclinpath_bilirubin]

  "Chemistry / Bilirubin - Conjugated":
    summary: >
      The water-soluble form of bilirubin already processed by the liver. It
      accumulates mainly when bile flow is impaired (cholestasis).
    high: >
      A higher conjugated fraction points toward liver disease or bile-duct
      obstruction.
    low: >
      A low/normal value is expected.
    isolation: >
      Read with total bilirubin and the cholestatic enzymes (ALP, GGT).
    sources: [eclinpath_bilirubin]

  "Chemistry / Bilirubin - Unconjugated":
    summary: >
      The form of bilirubin produced from hemoglobin breakdown before the liver
      conjugates it.
    high: >
      A higher unconjugated fraction suggests red-cell destruction (hemolysis)
      outpacing the liver's processing.
    low: >
      A low/normal value is expected.
    isolation: >
      Read with total bilirubin and red-cell values (hematocrit, reticulocytes).
    sources: [eclinpath_bilirubin]

  "Chemistry / Cholesterol":
    summary: >
      A blood lipid carried in the bloodstream; values are affected by recent
      meals and by several hormonal and metabolic conditions.
    high: >
      High cholesterol is often simply post-meal, but can accompany diabetes,
      cholestatic liver disease, or kidney disease with protein loss.
    low: >
      Low cholesterol can reflect liver insufficiency (including portosystemic
      shunts) or protein-losing conditions.
    isolation: >
      Most meaningful on a fasted sample and read with the rest of the panel.
    sources: [eclinpath_cholesterol]

  "Chemistry / Creatine Kinase":
    summary: >
      Creatine kinase (CK) is a leakage enzyme concentrated in muscle — the most
      specific marker of muscle-cell damage. It rises and clears quickly.
    high: >
      A high CK means muscle injury, which ranges from trivial (a rough blood
      draw, an injection, or a cat that has been recumbent/anorexic) to
      significant trauma or muscle disease.
    low: >
      Low CK is not clinically significant.
    isolation: >
      A mild rise is often handling-related; interpret with AST and the clinical
      picture rather than alone.
    sources: [eclinpath_ck]

  "Chemistry / Amylase":
    summary: >
      An enzyme historically associated with the pancreas. In cats it is not a
      reliable test for pancreatitis.
    high: >
      In cats a high amylase is non-specific — it is not diagnostic for
      pancreatic disease and can rise simply with reduced kidney clearance.
    low: >
      Low amylase is not clinically significant.
    isolation: >
      Feline pancreatitis is assessed with pancreas-specific tests (e.g. fPL /
      SpecfPL) and imaging, not amylase.
    sources: [eclinpath_amylase]

  "Chemistry / Lipase":
    summary: >
      An enzyme released by the pancreas. Standard ("catalytic") lipase is a poor
      test for pancreatitis in cats.
    high: >
      A high catalytic lipase is non-specific in cats and is also affected by
      kidney function and other organs.
    low: >
      Low lipase is not clinically significant.
    isolation: >
      Don't read catalytic lipase alone for feline pancreatitis — pancreas-
      specific lipase (fPL / DGGR) and imaging are used instead.
    sources: [eclinpath_lipase]

  "Chemistry / TCO2 (Bicarbonate)":
    summary: >
      Total CO2 is essentially a measure of blood bicarbonate, the body's main
      acid buffer, and is part of acid-base balance.
    high: >
      A high value (metabolic alkalosis) can follow vomiting of stomach acid or
      certain electrolyte disturbances.
    low: >
      A low value (metabolic acidosis) accompanies conditions that add acid or
      lose bicarbonate — kidney disease, diabetic ketoacidosis, or poor perfusion.
    isolation: >
      Interpret with the anion gap, electrolytes, and the cat's clinical status.
    sources: [eclinpath_acidbase]

  "Chemistry / Anion Gap":
    summary: >
      A calculated estimate of "unmeasured" acids in the blood, derived from the
      electrolytes; a screen for metabolic acidosis.
    high: >
      A widened anion gap suggests a build-up of acids such as ketones (diabetic
      ketoacidosis), lactate (poor perfusion), or certain toxins, or kidney
      failure.
    low: >
      A low anion gap is uncommon and usually just reflects low albumin.
    isolation: >
      A calculation read with TCO2/bicarbonate and the electrolytes, not alone.
    sources: [eclinpath_anion_gap]

  "Chemistry / Na: K Ratio":
    summary: >
      The ratio of sodium to potassium — a quick screening flag derived from two
      electrolytes.
    high: >
      A high ratio is generally not a concern.
    low: >
      A low Na:K ratio (from high potassium and/or low sodium) classically
      prompts consideration of Addison's disease (rare in cats), but is more
      often due to kidney/urinary disease, GI losses, body-cavity effusions, or
      sample handling.
    isolation: >
      Interpret the actual sodium and potassium values and the clinical picture,
      not the ratio on its own.
    sources: [eclinpath_sodium, eclinpath_potassium]

  "Chemistry / Osmolality":
    summary: >
      The concentration of dissolved particles in blood — driven mostly by
      sodium, glucose, and urea — reflecting the body's water balance.
    high: >
      High osmolality indicates a relative water deficit (dehydration) or high
      glucose or urea.
    low: >
      Low osmolality indicates a relative water excess.
    isolation: >
      Interpret with sodium, glucose, urea, and hydration status.
    sources: [eclinpath_fluid_changes, eclinpath_sodium]

  "Chemistry / IDEXX Cystatin B (Urine)":
    summary: >
      Cystatin B is a urine marker of active kidney tubular injury — it is
      released when tubule cells are damaged, so it reflects ongoing injury
      rather than overall filtration (unlike creatinine and SDMA).
    high: >
      A value at or above the lab's cutoff suggests active or recent kidney
      tubular injury and warrants a closer look.
    low: >
      A low value suggests a lower likelihood of active injury.
    isolation: >
      A newer marker interpreted alongside creatinine, SDMA, urine specific
      gravity, and the clinical picture.
    sources: [idexx_cystatin_b]

  # ---- Endocrinology ------------------------------------------------------
  "Endocrinology / Free T4 (ng/dL)":
    summary: >
      The unbound, active fraction of thyroid hormone. It is a confirmatory test
      for hyperthyroidism used to clarify a borderline total T4 — not a
      first-line screen, because it can read falsely high in cats that are sick
      for other reasons.
    high: >
      A high free T4 supports hyperthyroidism, but only when read alongside a
      high or high-normal total T4.
    low: >
      A low free T4 can occur with non-thyroidal illness.
    isolation: >
      A high free T4 with a low total T4 usually reflects other illness rather
      than thyroid disease; interpret with total T4 and clinical signs.
    sources: [aafp_hyperthyroid, cornell_thyroid]

  "Endocrinology / Free T4 (pmol/L)":
    summary: >
      The unbound, active fraction of thyroid hormone (reported in SI units). A
      confirmatory test for hyperthyroidism used to clarify a borderline total
      T4, not a first-line screen.
    high: >
      A high free T4 supports hyperthyroidism, but only when read alongside a
      high or high-normal total T4.
    low: >
      A low free T4 can occur with non-thyroidal illness.
    isolation: >
      A high free T4 with a low total T4 usually reflects other illness; interpret
      with total T4 and clinical signs.
    sources: [aafp_hyperthyroid, cornell_thyroid]

  # ---- Urinalysis (dipstick) ----------------------------------------------
  "Urinalysis / pH":
    summary: >
      How acidic or alkaline the urine is, influenced by diet, time since eating,
      and acid-base status.
    high: >
      Alkaline urine (higher pH) can follow a meal or certain diets, or a urinary
      infection with urease-producing bacteria, and favours struvite crystals.
    low: >
      Acidic urine (lower pH) is common in cats on meat-based diets and favours
      calcium oxalate crystals.
    isolation: >
      Read on a fresh sample (pH drifts as urine sits) and together with the
      sediment (crystals, bacteria).
    sources: [eclinpath_ua_chemical]

  "Urinalysis / Ketones":
    summary: >
      Ketones are byproducts of fat metabolism, normally absent from urine.
    high: >
      Ketones in the urine most often accompany diabetic ketoacidosis, but can
      also appear with prolonged anorexia or fasting.
    low: >
      "Negative" is the normal result.
    isolation: >
      Read with blood glucose — ketones plus high glucose is a diabetic-emergency
      flag.
    sources: [eclinpath_ua_chemical, merck_diabetes]

  "Urinalysis / Blood / Hemoglobin":
    summary: >
      The dipstick "blood" pad detects heme, which can come from intact red
      cells, free hemoglobin, or muscle myoglobin — it can't tell them apart.
    high: >
      A positive can mean true bleeding into the urinary tract (stones,
      inflammation, infection, tumour) or hemoglobin/myoglobin in the blood.
    low: >
      "Negative" is the normal result.
    isolation: >
      Always confirm against the sediment — a positive pad with no red cells on
      microscopy points to hemoglobin or myoglobin rather than bleeding.
    sources: [eclinpath_ua_chemical, eclinpath_ua_cells]

  "Urinalysis / Bilirubin":
    summary: >
      Bilirubin (a bile pigment) detected on the dipstick.
    high: >
      Any bilirubin in cat urine is abnormal and can be an early sign of liver
      disease or red-cell breakdown (unlike dogs, cats should not have bilirubin
      in their urine).
    low: >
      "Negative" is the normal result.
    isolation: >
      Read with blood bilirubin and the liver enzymes.
    sources: [eclinpath_ua_chemical, eclinpath_bilirubin]

  "Urinalysis / Urobilinogen":
    summary: >
      A pigment derived from bilirubin in the gut. The urine dipstick pad is of
      limited diagnostic value in animals.
    high: >
      Results are unreliable and are not used to diagnose disease on their own.
    low: >
      A normal/low result is expected.
    isolation: >
      Generally not interpreted in isolation; liver assessment relies on blood
      tests.
    sources: [eclinpath_ua_chemical]

  # ---- Urinalysis (physical) ----------------------------------------------
  "Urinalysis / Color":
    summary: >
      The urine's colour, normally pale to dark yellow depending on how
      concentrated it is. Red or brown can indicate blood, hemoglobin, or
      myoglobin; very dark can indicate bilirubin; colourless suggests very
      dilute urine.
    isolation: >
      Interpret with the specific gravity and the sediment/chemistry pads rather
      than on its own.
    sources: [eclinpath_ua_visual]

  "Urinalysis / Clarity":
    summary: >
      How clear or cloudy the urine is. Cloudiness (turbidity) can come from
      cells, crystals, mucus, or debris.
    isolation: >
      Cloudiness is a prompt to examine the sediment; clear urine can still
      contain abnormalities.
    sources: [eclinpath_ua_visual]

  "Urinalysis / Collection Method":
    summary: >
      How the sample was obtained — cystocentesis (a needle into the bladder),
      free catch, or catheter — which affects how the results are read.
    isolation: >
      Cystocentesis is cleanest for assessing infection (bacteria or blood in a
      free-catch sample may be contamination) but can add a little blood; note
      the method when reading the sediment.
    sources: [eclinpath_ua_cells]

  # ---- Urinalysis (sediment) ----------------------------------------------
  "Urinalysis / Red Blood Cells":
    summary: >
      Red blood cells seen in the urine sediment under the microscope.
    high: >
      Increased red cells (hematuria) can come from inflammation, infection,
      stones, trauma (including the collection needle), or tumours anywhere along
      the urinary tract.
    low: >
      None to a few is normal — a few are common right after cystocentesis.
    isolation: >
      Read with the collection method and the rest of the sediment.
    sources: [eclinpath_ua_cells]

  "Urinalysis / White Blood Cells":
    summary: >
      White blood cells seen in the urine sediment.
    high: >
      Increased white cells (pyuria) suggests inflammation or infection of the
      urinary tract.
    low: >
      None to a few is normal.
    isolation: >
      Read with bacteria in the sediment and the collection method; pyuria plus
      bacteria supports infection.
    sources: [eclinpath_ua_cells]

  "Urinalysis / Bacteria":
    summary: >
      Bacteria seen in the urine sediment.
    high: >
      True bacteriuria suggests a urinary tract infection, especially with white
      cells present — but free-catch samples are often contaminated.
    low: >
      "None seen" is the expected result.
    isolation: >
      Interpret with white cells and the collection method; a culture (ideally
      from cystocentesis) is the gold standard for confirming infection.
    sources: [eclinpath_ua_cells]

  "Urinalysis / Epithelial Cells":
    summary: >
      Cells shed from the lining of the urinary and genital tract into the
      sediment.
    high: >
      Small numbers are normal; many cells can reflect inflammation or, rarely,
      abnormal cells worth a closer look.
    low: >
      Few to none is normal.
    isolation: >
      Usually a minor finding read with the rest of the sediment.
    sources: [eclinpath_ua_cells]

  "Urinalysis / Casts":
    summary: >
      Cylindrical "molds" formed inside the kidney tubules and flushed into the
      urine.
    high: >
      A few hyaline casts can be normal, but increased or cellular/granular casts
      point to active kidney tubular injury.
    low: >
      None to rare is normal.
    isolation: >
      A specific clue to kidney (tubular) injury, read with the blood kidney
      values and urine specific gravity.
    sources: [eclinpath_ua_casts]

  "Urinalysis / Crystals":
    summary: >
      Mineral crystals that can form in urine; the type (e.g. struvite, calcium
      oxalate) matters more than their mere presence.
    high: >
      Crystals can be normal — especially in urine that has sat or cooled — but
      some types relate to stone risk or specific conditions.
    low: >
      None is common and normal.
    isolation: >
      Interpret with urine pH, how fresh the sample is, and any history of
      stones; crystals alone don't equal disease.
    sources: [eclinpath_ua_crystals]

  "Urinalysis / Mucus":
    summary: >
      Mucus threads in the urine sediment.
    high: >
      Small amounts are usually unimportant; more can reflect contamination or
      lower-tract irritation.
    low: >
      Little to none is normal.
    isolation: >
      Generally a minor finding.
    sources: [eclinpath_ua_cells]

  # ---- Serology -----------------------------------------------------------
  "Serology / FeLV Antigen (ELISA)":
    summary: >
      A screening test for feline leukemia virus (FeLV) that detects viral
      antigen in the blood.
    high: >
      A positive (antigen-detected) result indicates FeLV infection and should be
      confirmed by a second method — a single positive in a healthy, low-risk cat
      can be a false positive.
    low: >
      A negative is reassuring, but a recently exposed cat may need retesting.
    isolation: >
      Confirm positives and interpret with the cat's risk and clinical status,
      per AAFP guidance.
    sources: [aafp_retrovirus]

  "Serology / FIV Antibody (ELISA)":
    summary: >
      A screening test for feline immunodeficiency virus (FIV) that detects
      antibodies to the virus.
    high: >
      A positive (antibody-detected) result suggests FIV exposure or infection;
      because vaccinated cats and kittens with maternal antibody can also test
      positive, positives are confirmed and read with the history.
    low: >
      A negative is reassuring; retest if recent exposure is possible, since
      antibodies take weeks to appear.
    isolation: >
      Confirm and interpret positives per AAFP guidance, accounting for
      vaccination and age.
    sources: [aafp_retrovirus]

  "Serology / Heartworm Antigen":
    summary: >
      A test that detects antigen from adult heartworms.
    high: >
      A positive supports heartworm infection.
    low: >
      In cats a negative does NOT rule it out — cats often have very few worms or
      single-sex/immature infections, so antigen tests miss many cases.
    isolation: >
      In cats, interpret a negative cautiously and pair it with antibody testing
      and imaging, per American Heartworm Society guidance.
    sources: [ahs_heartworm]

  # ---- Parasitology -------------------------------------------------------
  "Parasitology / Ova & Parasites - Zinc Sulfate Centrifugation":
    summary: >
      A fecal flotation (zinc-sulfate centrifugation) that concentrates and
      detects parasite eggs and cysts under the microscope.
    high: >
      Finding ova or parasites confirms infection.
    low: >
      "None seen" lowers the likelihood but doesn't eliminate it — shedding is
      intermittent and some parasites are missed.
    isolation: >
      A negative flotation with ongoing signs may warrant repeat testing or
      antigen tests, per CAPC.
    sources: [capc_parasites]

  "Parasitology / Roundworm Antigen":
    summary: >
      An antigen test for roundworms (Toxocara) that detects the worms directly,
      catching infections the microscope misses (single-sex worms, or worms not
      yet shedding eggs).
    high: >
      A positive confirms roundworm infection.
    low: >
      A negative is reassuring.
    isolation: >
      Complements fecal flotation; CAPC recommends routine fecal screening.
    sources: [idexx_fecal_dx, capc_parasites]

  "Parasitology / Hookworm Antigen":
    summary: >
      An antigen test for hookworms that detects the worms directly, catching
      infections the microscope can miss.
    high: >
      A positive confirms hookworm infection.
    low: >
      A negative is reassuring.
    isolation: >
      Complements fecal flotation, per CAPC.
    sources: [idexx_fecal_dx, capc_parasites]

  "Parasitology / Whipworm Antigen":
    summary: >
      An antigen test for whipworms.
    high: >
      A positive indicates whipworm antigen; note that true feline whipworm
      infection is rare in North America, so positives are interpreted carefully.
    low: >
      A negative is the expected, reassuring result.
    isolation: >
      Complements fecal flotation, per CAPC.
    sources: [idexx_fecal_dx, capc_parasites]

  "Parasitology / Flea Tapeworm Antigen":
    summary: >
      An antigen test for the flea tapeworm (Dipylidium caninum).
    high: >
      A positive indicates tapeworm antigen and goes hand-in-hand with flea
      control.
    low: >
      A negative is reassuring.
    isolation: >
      Interpret with the cat's flea exposure and history.
    sources: [idexx_fecal_dx, capc_parasites]

  "Parasitology / Cystoisospora Antigen":
    summary: >
      An antigen test for Cystoisospora, a single-celled (coccidian) intestinal
      parasite.
    high: >
      A positive indicates infection — most significant in kittens or cats with
      diarrhea.
    low: >
      A negative is reassuring.
    isolation: >
      Interpret with the cat's age and any GI signs.
    sources: [idexx_fecal_dx, capc_parasites]
