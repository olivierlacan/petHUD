# Citation registry for the medical-context knowledge base.
#
# Every claim in analytes.yml / relationships.yml / conditions.yml references
# one or more of these source ids. Keeping the actual URLs in one place makes
# the provenance auditable at a glance and easy to re-verify.
#
# All URLs below were verified reachable on 2026-06-03. If a link rots, update
# it here once and every claim that cites it is fixed.
#
# Source tiers (per project decision: "broadest reputable set"):
#   academic  — university clinical-pathology references, peer-reviewed journals
#   guideline — professional-association consensus statements / guidelines
#   reference — established veterinary reference works
#   industry  — diagnostic-lab reference material (clearly labeled)

