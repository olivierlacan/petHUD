<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>pethud — pet bloodwork trends</title>
  <!-- Apply the saved/queried theme before first paint to avoid a flash. -->
  <script>
    (function () {
      try {
        var q = new URLSearchParams(location.search).get("theme");
        var t = q || localStorage.getItem("pethud-theme") || "auto";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) { document.documentElement.setAttribute("data-theme", "auto"); }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">pethud</span>
      <span class="sub">pet bloodwork trends</span>
    </div>

    <div class="controls">
      <label class="ctl">
        <span>Patient</span>
        <select id="patient"></select>
      </label>

      <div class="seg" id="view-toggle" role="tablist">
        <button data-view="trends" class="active">Trends</button>
        <button data-view="conditions">Conditions</button>
        <button data-view="reports">Reports</button>
      </div>

      <label class="ctl search">
        <span>Search</span>
        <input id="search" type="search" placeholder="analyte name…" autocomplete="off">
      </label>

      <label class="check">
        <input type="checkbox" id="abnormal-only">
        <span>Out of range only</span>
      </label>

      <div class="meta" id="patient-meta"></div>
    </div>
  </header>

  <main>
    <aside class="sidebar">
      <div class="side-title">Sections</div>
      <ul id="section-filter" class="section-list"></ul>
      <div class="side-foot" id="corpus-meta"></div>
    </aside>

    <section class="content">
      <div id="trends" class="view"></div>
      <div id="conditions" class="view" hidden></div>
      <div id="reports" class="view" hidden></div>
    </section>
  </main>

  <!-- Detail overlay for a single analyte -->
  <div id="detail" class="overlay" hidden>
    <div class="overlay-card">
      <button class="close" id="detail-close" aria-label="Close">&times;</button>
      <div id="detail-body"></div>
    </div>
  </div>

  <!-- Drag-and-drop import affordance -->
  <div id="dropzone" class="dropzone" hidden>
    <div class="drop-inner">
      <div class="drop-icon">⤓</div>
      <div class="drop-text">Drop IDEXX PDF report(s) to import</div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <!-- Theme override: Auto (system) / Light / Dark -->
  <div id="theme-toggle" class="theme-toggle" role="group" aria-label="Color theme">
    <button data-theme-set="auto" title="Match system" aria-label="Match system">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="9"></circle><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"></path>
      </svg>
    </button>
    <button data-theme-set="light" title="Light" aria-label="Light">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="12" cy="12" r="4.2"></circle>
        <path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.1 5.1l1.6 1.6M17.3 17.3l1.6 1.6M18.9 5.1l-1.6 1.6M6.7 17.3l-1.6 1.6"></path>
      </svg>
    </button>
    <button data-theme-set="dark" title="Dark" aria-label="Dark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
      </svg>
    </button>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
